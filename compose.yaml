
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped
